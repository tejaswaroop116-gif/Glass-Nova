name: Glass Nova Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  syntax-and-unit-tests:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Python syntax across all modules
        run: |
          python -B -c "import ast, pathlib; files = sorted(pathlib.Path('.').glob('*.py')); [ast.parse(p.read_text(encoding='utf-8'), filename=str(p)) for p in files]; print(f'AST syntax check passed for {len(files)} Python files.')"

      - name: Run security audit and reliability tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -B test_security_audit.py -v
          python -B test_offline_capability.py -v
          python -B test_lifecycle_and_voice_controls.py -v
          python -B test_website.py -v

      - name: Run Glass Nova feature pack unit tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -B test_nus_feature_pack.py -v
          python -B test_workflows_milestone.py -v

      - name: Run Glass Nova integration tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -B test_upgrade_integration.py

      - name: Run screen interaction and permission pipeline tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -B test_screen_interaction.py -v
          python -B test_pipeline_e2e.py
